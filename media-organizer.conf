# =============================================================================
#  Media Organizer  —  configuration
# -----------------------------------------------------------------------------
#  Lines starting with '#' are comments. Format:  key = value
#  Lists are comma-separated.  Edit freely; the app reads keys dynamically.
# =============================================================================

# -----------------------------------------------------------------------------
#  Paths  (REQUIRED — change these to your own folders)
# -----------------------------------------------------------------------------
source = E:\=transfer\mobAm20260314\DCIM
target = E:\=transfer\mobAm20260314\DCIM_cat

# -----------------------------------------------------------------------------
#  Behavior
# -----------------------------------------------------------------------------
dry-run                = true
require-confirmation   = true
move-log               = media-organizer-move.log
unknown-threshold      = 0.40
fallback-folder        = other        ; images/videos below the threshold go here
collision-suffix       = ({n})        ; rendered with a leading space: " (2)"
move-sidecars          = true
sidecar-extensions     = .json, .xmp, .aae, .thm, .srt, .nfo, .txt, .vtt

# -----------------------------------------------------------------------------
#  Performance — both GPU and CPU are used to maximum capacity
# -----------------------------------------------------------------------------
use-gpu                = auto      ; auto | yes | no   (GPU via DirectML, CPU fallback)
gpu-workers            = auto      ; CLI workers that use the GPU; others use the CPU.
                                   ; auto = 4 (each needs ~400 MB of GPU memory)
cpu-workers            = auto      ; auto = os.cpu_count()
gpu-batch-size         = 16

# -----------------------------------------------------------------------------
#  File-type extensions
# -----------------------------------------------------------------------------
ext-image = .jpg, .jpeg, .png, .bmp, .gif, .tiff, .tif, .webp, .heic, .heif
ext-video = .mp4, .mov, .avi, .mkv, .wmv, .m4v, .mpg, .mpeg, .webm, .flv
ext-audio = .mp3, .wav, .flac, .aac, .m4a, .ogg, .opus, .wma

# -----------------------------------------------------------------------------
#  Image folders -> content types
#  Add as many `image-<folder> = ...` lines as you want; the matching folder
#  is created under <target>\images\<folder>#  Each content type needs a `prompts-<type>` line (see the end of the file).
#  Anything below unknown-threshold goes to images\<fallback-folder># -----------------------------------------------------------------------------
image-personal    = person
image-documents   = document
image-objects     = object
image-screenshots = screenshot
image-other       = scenery

# -----------------------------------------------------------------------------
#  Video folders -> content types   (5 frames per video, best frame wins)
# -----------------------------------------------------------------------------
video-personal    = person
video-documents   = document
video-objects     = object
video-screenshots = screenshot      ; screen recordings
video-other       = scenery

# -----------------------------------------------------------------------------
#  Face detection (YuNet)
#  -----------------------------------------------------------------------------
#  A face with detector score >= face-min-score adds face-boost to the
#  face-target content type.  Real faces score ~0.90+; cartoon faces on toys,
#  cookies and stickers mostly score below 0.88, so they don't count.
#  Set face-detection = false to disable entirely.
# -----------------------------------------------------------------------------
face-detection             = true
face-min-score             = 0.88
face-boost                 = 0.50
face-target-content-type   = person

# -----------------------------------------------------------------------------
#  Screenshot detection from file metadata
#  -----------------------------------------------------------------------------
#  screenshot-metadata = true:
#    * iOS EXIF UserComment "Screenshot" or a file name containing
#      "screenshot" -> straight to the screenshot content type.
#    * Camera EXIF (Make) present -> a camera photo, never a screenshot.
#  screenshot-tall-boost: added to the screenshot score for phone-shaped
#    images (>= 1.9:1) without camera EXIF, e.g. screenshots re-sent by
#    a messenger app (metadata stripped).
# -----------------------------------------------------------------------------
screenshot-metadata        = true
screenshot-content-type    = screenshot
screenshot-tall-boost      = 0.50

# -----------------------------------------------------------------------------
#  OCR (Tesseract) - optional.  0 = off (default; CLIP already recognizes
#  documents, and OCR is the slowest step).  > 0 adds
#  ocr-boost * min(1, words / 30) to ocr-content-type.
# -----------------------------------------------------------------------------
ocr-boost                  = 0
ocr-content-type           = document

# -----------------------------------------------------------------------------
#  Audio thresholds (talk wins over music when both signals overlap)
# -----------------------------------------------------------------------------
audio-talk-min-speech-ratio   = 0.60
audio-music-max-speech-ratio  = 0.20

# -----------------------------------------------------------------------------
#  Music rhythm (BPM) -> subfolder under audio\music\
#  Music with weak / no detectable beat goes to audio\music\unknown-rythm\
# -----------------------------------------------------------------------------
rhythm-slow   = 0-90
rhythm-medium = 90-130
rhythm-high   = 130-300

# =============================================================================
#  Content type -> CLIP prompts
#  -----------------------------------------------------------------------------
#  CLIP compares the image with each sentence.  A content type's score is
#  the summed probability of its sentences (all types together sum to 1).
#  Add sentences to catch more cases; keep them short and generic.
#  Don't use ',' ';' or '#' inside a sentence.
# =============================================================================

prompts-person = a photo of a person, a selfie, a photo of a group of people, a photo of a family, a photo of a woman, a photo of a man, a photo of a child, a mirror selfie, a portrait photo

prompts-document = a photo of a document, a photo of a paper with text, a photo of handwriting, an id card, a page of a book, a receipt, a photo of a form

prompts-object = a photo of an object, a photo of a product, a photo of cookies, a photo of food, a photo of a toy, a photo of clothes, a photo of a handmade craft

prompts-screenshot = a screenshot of a phone, a screenshot of a chat app, a screenshot of a website, a screenshot of social media, a screenshot of a map app

prompts-scenery = a photo of a landscape, a photo of a street, a photo of an animal, a photo of a room, clipart, a photo of a building, a dark photo, a photo of flowers, a logo, a black image, a photo of the sky, a blurry photo

# =============================================================================
#  End of file.
# =============================================================================
