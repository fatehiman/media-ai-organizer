keywords-buildings = church, palace, castle, mosque, library, theater, planetarium, dome, stupa, monastery, barn, beacon, boathouse, prison, restaurant, triumphal_arch, viaduct, water_tower, lighthouse, greenhouse, cinema, bell_cote, fountain

keywords-museum = museum, gallery

# Paintings.  ImageNet has no clean "painting" class, but it has a few
# proxies: comic_book, book_jacket, jigsaw_puzzle.  The blank-paper
# heuristic and OCR are NOT used for paintings; this is keyword-only.
keywords-painting = comic_book, book_jacket, jigsaw_puzzle

keywords-nonsense = screw, nail, hammer, screwdriver, wrench, plunger, can_opener, corkscrew, cup, coffee_mug, beer_glass, wine_bottle, bottle, vase, lamp, table_lamp, candle, hair_slide, safety_pin, shopping_basket, shopping_cart, packet, paper_towel, plastic_bag, garbage_truck, mailbox, ashcan, broom, bucket, mop, pencil_box, ballpoint, fountain_pen, paintbrush, plate_rack, washbasin, soap_dispenser, switch, electrical, sunglasses, perfume, lotion, lipstick, hair_spray, eraser, rubber_eraser, ruler, paperclip, thumbtack, scissors, sandbox

# Paper / document classes from ImageNet — additive with OCR + blank-paper
# heuristic.  An ImageNet 'envelope' or 'menu' prediction is a strong
# document signal even when OCR finds no readable text.
keywords-paper = envelope, menu, book_jacket, binder, web_site

