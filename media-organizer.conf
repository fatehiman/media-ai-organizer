# =============================================================================
#  Media Organizer  —  configuration
# -----------------------------------------------------------------------------
#  Lines starting with '#' are comments. Format:  key = value
#  Lists are comma-separated.  Edit freely; the app reads keys dynamically.
# =============================================================================

# -----------------------------------------------------------------------------
#  Paths  (REQUIRED — change these to your own folders)
# -----------------------------------------------------------------------------
source = E:\=transfer\mobAm20260314\DCIM
target = E:\=transfer\mobAm20260314\DCIM_cat

# -----------------------------------------------------------------------------
#  Behavior
# -----------------------------------------------------------------------------
dry-run                = true
require-confirmation   = true
move-log               = media-organizer-move.log
unknown-threshold      = 0.40
collision-suffix       = ({n})        ; rendered with a leading space: " (2)"
move-sidecars          = true
sidecar-extensions     = .json, .xmp, .aae, .thm, .srt, .nfo, .txt, .vtt

# -----------------------------------------------------------------------------
#  Performance — both GPU and CPU are used to maximum capacity
# -----------------------------------------------------------------------------
use-gpu                = auto      ; auto | yes | no
cpu-workers            = auto      ; auto = os.cpu_count()
gpu-batch-size         = 16

# -----------------------------------------------------------------------------
#  File-type extensions
# -----------------------------------------------------------------------------
ext-image = .jpg, .jpeg, .png, .bmp, .gif, .tiff, .tif, .webp, .heic, .heif
ext-video = .mp4, .mov, .avi, .mkv, .wmv, .m4v, .mpg, .mpeg, .webm, .flv
ext-audio = .mp3, .wav, .flac, .aac, .m4a, .ogg, .opus, .wma

# -----------------------------------------------------------------------------
#  Image folders -> content types
#  Add as many `image-<folder> = ...` lines as you want; the matching folder
#  is created under <target>\images\<folder>\
#  Anything not matched (or below unknown-threshold) goes to images\unknown\
# -----------------------------------------------------------------------------
image-personal = human, nature, animals, buildings, museum
image-docs     = paper
image-painting = painting
image-nonsense = nonsense

# -----------------------------------------------------------------------------
#  Video folders -> content types
# -----------------------------------------------------------------------------
video-personal = human, nature, animals, buildings
video-nonsense = nonsense

# -----------------------------------------------------------------------------
#  Face detection (boosts a content type when an OpenCV Haar cascade fires)
#  -----------------------------------------------------------------------------
#  ImageNet has no 'person' class, so the model often misses photos of
#  people.  When a frontal- or profile-face cascade detects at least one
#  face, the configured target content type is forced to face-boost.
#  Set face-detection = false to disable entirely.
# -----------------------------------------------------------------------------
face-detection             = true
face-boost                 = 0.95
face-target-content-type   = human

# -----------------------------------------------------------------------------
#  Audio thresholds (talk wins over music when both signals overlap)
# -----------------------------------------------------------------------------
audio-talk-min-speech-ratio   = 0.60
audio-music-max-speech-ratio  = 0.20

# -----------------------------------------------------------------------------
#  Music rhythm (BPM) -> subfolder under audio\music\
#  Music with weak / no detectable beat goes to audio\music\unknown-rythm\
# -----------------------------------------------------------------------------
rhythm-slow   = 0-90
rhythm-medium = 90-130
rhythm-high   = 130-300

# =============================================================================
#  Content type -> ImageNet class keywords
#  -----------------------------------------------------------------------------
#  Each `keywords-<type>` list contains substrings to match against ImageNet
#  class names (1000 classes).  The image classifier sums the model's
#  probabilities over all matching classes; the type with the highest sum wins
#  (subject to unknown-threshold).
#
#  'paper' is OCR-driven (no class keywords needed).
# =============================================================================

keywords-human = person, man, woman, baby, bride, groom, scuba_diver, ballplayer

keywords-nature = valley, seashore, mountain, alp, cliff, sandbar, lakeside, geyser, volcano, coral_reef, promontory, rapeseed, hay, hen-of-the-woods, daisy, yellow_lady's_slipper, agaric

